[package]
name = "questro"
version = "3.5.2"
edition = "2021"
description = "Questro portable desktop application"
build = "build.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy", "gzip", "brotli"] }
chrono = "0.4"
rand = "0.9"
sha2 = "0.10"
url = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
