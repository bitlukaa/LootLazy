<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questro</title>
<link rel="icon" href="favicon.ico"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/reference.css">
</head>
<body>
<header class="titlebar">
 <div class="brand"><img src="assets/questro-logo.svg" width="25" height="25" alt=""><span>Questro</span></div>
 <div class="window-tools">


  <div id="html-window-controls"><button id="win-min-btn" class="window-button" data-i18n-title="window_minimize"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10"/></svg></button><button id="win-max-btn" class="window-button" data-i18n-title="window_maximize"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button><button id="win-close-btn" class="window-button window-close" data-i18n-title="window_close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m1 1 10 10M11 1 1 11"/></svg></button></div>
 </div>
</header>
<div class="app-shell"><header class="reference-navbar"><nav class="navigation" data-i18n-aria-label="navigation">
 <button class="nav-tab active" data-tab="simulator"><span data-i18n="tab_simulator">المحاكي</span></button>
 <button class="nav-tab" data-tab="quests"><span data-i18n="tab_quests">المهام</span></button>
 <button class="nav-tab" data-tab="settings"><span data-i18n="tab_settings">الإعدادات</span></button>
</nav></header>
<div class="app-scroll"><main class="app-content">
<section id="view-simulator" class="view-panel active">
 <div class="page-heading"><div><h1 data-i18n="tab_simulator">المحاكي</h1></div><div class="sim-modes" role="group" data-i18n-aria-label="simulation_mode"><button class="sim-mode active" data-sim-mode="library"><span id="mode-library-icon"></span><span data-i18n="select_from_list"></span></button><button class="sim-mode" data-sim-mode="custom"><span id="mode-custom-icon"></span><span data-i18n="custom_process"></span></button><button class="sim-mode" data-sim-mode="selected"><span id="mode-selected-icon"></span><span data-i18n="selected_games"></span><span id="selected-games-count" class="count-badge">0</span></button></div></div>
 <div id="simulation-workspace" class="workspace-grid">
  <aside class="panel games-panel">
   <div class="panel-heading"><h2><span id="select-game-icon"></span><span data-i18n="select_game">اختر لعبة</span></h2><div class="picker-heading-actions"><button id="refresh-games-btn" class="icon-button" data-i18n-title="refresh_catalog" data-i18n-aria-label="refresh_catalog"><span id="refresh-games-icon" class="refresh-icon"></span></button></div></div>
   <div class="search-field"><span id="search-icon-slot"></span><input id="game-search-input" type="search" autocomplete="off" data-i18n-placeholder="search_placeholder" data-i18n-aria-label="search_placeholder"></div>
   <p id="catalog-count-badge" class="picker-total muted">—</p>
   <div id="simulator-game-list" class="game-list" data-i18n-aria-label="games"></div>
  </aside>
  <div class="session-column">
   <section class="panel session-panel"><div class="configuration-heading"><h2 data-i18n="game_configuration">إعدادات اللعبة</h2></div>
    <div id="game-empty" class="game-empty" data-i18n="pick_game"></div><div class="game-overview"><div id="sim-game-avatar" class="artwork artwork-large"></div><div class="game-overview-title"><p class="eyebrow" data-i18n="selected_game">اللعبة المختارة</p><h2 id="sim-game-title" data-i18n="pick_game">اختر لعبة</h2><p id="sim-game-id" class="muted game-id" dir="ltr"></p><button id="edit-game-executable" class="game-edit" type="button"><span id="edit-game-icon"></span><span data-i18n="edit_executable">Edit executable</span></button></div><span id="sim-status-text" class="status-pill" data-i18n="idle_sim">متوقف</span><div class="session-clock"><div hidden><span data-i18n="elapsed">وقت التشغيل</span><strong id="sim-stopwatch-display">00:00:00</strong></div><div class="remaining-clock" id="remaining-clock" hidden><span data-i18n="remaining">المتبقي</span><strong id="idle-remaining-label">—</strong></div></div></div>
    <div id="idle-progress-wrap" class="progress-track" hidden><div id="idle-progress-bar"></div></div>
    <div class="duration-section"><div class="section-heading"><h3 data-i18n="duration">مدة التشغيل</h3><span id="duration-summary" class="muted"></span></div>
     <div class="duration-presets"><button data-duration="0" class="duration-preset" data-i18n="idle_continuous">مستمر</button><button data-duration="15" class="duration-preset active" data-i18n="idle_15m">15 دقيقة</button><button data-duration="30" class="duration-preset" data-i18n="idle_30m">30 دقيقة</button><button data-duration="60" class="duration-preset" data-i18n="idle_1h">ساعة</button><button data-duration="custom" class="duration-preset" data-i18n="idle_custom">مخصص</button></div>
     <div id="idle-custom-input-row" class="duration-custom" hidden><label><span data-i18n="hours">ساعات</span><input id="duration-hours" type="number" min="0" max="24" value="0" inputmode="numeric"></label><span class="time-separator">:</span><label><span data-i18n="minutes">دقائق</span><input id="duration-minutes" type="number" min="0" max="59" value="15" inputmode="numeric"></label></div>
    </div>
    <p id="duration-error" class="duration-error" data-i18n="invalid_duration" role="alert" hidden></p>
    <p id="resolution-note" class="inline-note" hidden></p>
    <section class="executable-settings"><div class="advanced-body"><label><span data-i18n="target_exe">ملف التشغيل</span><select id="sim-executable-select" hidden></select><div class="exe-dropdown"><button id="exe-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="exe-value"></span><span class="exe-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg></span></button><div id="exe-options" role="listbox" hidden></div></div></label><div class="custom-file-row"><label><span data-i18n="custom_override">اسم ملف مخصص</span><input id="custom-exe-input" placeholder="game.exe" dir="ltr" autocomplete="off"></label><button id="save-override-btn" class="button button-secondary" data-i18n="save_apply">حفظ</button></div><p id="executable-source" class="muted"></p><p id="session-pid-text" class="muted technical-line"></p></div></section><div class="session-actions"><button id="btn-toggle-sim" class="button button-primary" disabled><span id="btn-sim-icon"></span><span id="btn-sim-text" data-i18n="start_sim">بدء التشغيل</span></button></div>
    
   </section>

  </div>
 </div>
   <section id="queue-panel" class="panel selected-games-panel" hidden><div class="queue-summary"><div><span id="queue-title-icon"></span><h2 data-i18n="selected_games">الألعاب المختارة</h2><span id="queue-count" class="count-badge">0</span></div><div><span id="queue-status" class="status-pill"></span></div></div><div class="queue-body"><p id="queue-current" class="inline-note"></p><div id="queue-list" class="queue-list"></div><div class="queue-actions"><button id="queue-next-btn" class="button button-primary" hidden data-i18n="queue_next">ابدأ التالية</button><button id="queue-start-btn" class="button button-primary" data-i18n="queue_start">ابدأ الطابور</button><button id="queue-cancel-btn" class="button button-danger" data-i18n="quest_stop">إيقاف</button><button id="queue-clear-btn" class="button button-quiet" data-i18n="queue_clear">مسح</button></div></div></section>
</section>
<section id="view-quests" class="view-panel">
 <div class="page-heading"><div class="page-title"><h1 data-i18n="tab_quests">المهام</h1><span id="quests-count" class="count-badge"></span></div><div class="heading-actions"><button id="btn-refresh-quests" class="button button-primary"><span id="refresh-quests-icon-slot" class="refresh-icon"></span><span data-i18n="refresh_quests">تحديث المهام</span></button></div></div>
 <div id="quests-error" class="error-banner" role="alert" hidden></div>
 <div id="quests-container" class="quests-grid"></div>
</section>
<section id="view-settings" class="view-panel settings-view">
 <div class="page-heading"><div><h1 data-i18n="tab_settings">الإعدادات</h1></div></div>
 <section class="panel preferences-settings">
  <div class="settings-row"><h2 data-i18n="appearance">Appearance</h2><div class="settings-choices" role="group" data-i18n-aria-label="appearance"><button class="button button-secondary" data-theme-choice="light" aria-pressed="false"><span id="settings-light-icon"></span><span data-i18n="theme_light">Light</span></button><button class="button button-secondary" data-theme-choice="dark" aria-pressed="false"><span id="settings-dark-icon"></span><span data-i18n="theme_dark">Dark</span></button></div></div>
  <div class="settings-row"><h2 data-i18n="language">Language</h2><div class="settings-choices" role="group" data-i18n-aria-label="language"><button class="button button-secondary" data-lang="en" aria-pressed="false" data-i18n="language_en">English</button><button class="button button-secondary" data-lang="ar" aria-pressed="false" data-i18n="language_ar">Arabic</button></div></div>
 </section>
 <section class="panel updates-settings">
  <div class="settings-row"><div><h2 data-i18n="updates_title">Updates</h2><p id="app-version" class="muted"></p></div><div class="update-check"><button id="btn-check-updates" class="button button-secondary"><span id="updates-refresh-icon" class="refresh-icon"></span><span data-i18n="check_updates">Check updates</span></button><p><span data-i18n="last_checked">Last checked</span><span id="updates-last-checked">—</span></p></div></div>
  <div class="update-summary"><span id="update-available-badge" class="count-badge" hidden data-i18n="update_available">Update available</span><p id="update-status" role="status" class="muted"></p><button id="btn-open-releases" class="button button-primary" data-i18n="open_releases">Open releases</button></div>
  <details class="release-notes"><summary><span data-i18n="whats_new">What's new</span><span id="notes-version" class="muted"></span></summary><div id="release-notes-body"></div></details>
 </section>
</section>
</main></div>
</div>
<dialog id="duration-dialog"><form id="duration-edit-form"><div class="dialog-heading"><h2 data-i18n="edit_duration">تعديل المدة</h2><button type="button" id="duration-dialog-close" class="icon-button" data-i18n-aria-label="cancel">×</button></div><p id="duration-edit-game" class="muted"></p><div class="duration-custom"><label><span data-i18n="hours">ساعات</span><input id="edit-hours" type="number" min="0" max="24" required></label><span class="time-separator">:</span><label><span data-i18n="minutes">دقائق</span><input id="edit-minutes" type="number" min="0" max="59" required></label></div><div class="dialog-actions"><button type="button" id="duration-dialog-cancel" class="button button-quiet" data-i18n="cancel">إلغاء</button><button type="submit" class="button button-primary" data-i18n="save_apply">حفظ</button></div></form></dialog>
<div id="toast-container" role="status" aria-live="polite"></div>
<script src="js/desktop.js"></script><script src="js/icons.js"></script><script src="js/i18n.js"></script><script src="js/app.js"></script>
</body></html>
