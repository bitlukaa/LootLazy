name: Steam engine verification
on:
  push:
    branches: [main, feature/**]
    paths:
      - engine/**
      - tools/*steam-engine*
      - .github/workflows/steam-engine.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build integrated engine and verify encrypted persistence
        run: ./tools/build-steam-engine.ps1
      - name: Account protocol and startup regressions
        run: node tools/test-steam-engine.cjs; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; node tools/test-steam-engine-startup.cjs
