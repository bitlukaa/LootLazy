name: Tauri Windows
on:
  push:
    branches: [main, tauri-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Frontend unit and localization regressions
        run: npm run test:unit
      - name: Isolated renderer regressions
        run: npm run test:renderer
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Build session helper from source
        run: ./tools/build-helper.ps1
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust regressions
        run: ./tools/test-tauri.ps1
      - name: Update replacement regressions
        run: ./tools/test-update-install.ps1
      - name: Build portable application
        run: ./tools/build-tauri.ps1
      - name: Build Setup installer
        run: ./tools/build-setup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LootLazy-Windows
          path: |
            releases/*-Setup.exe
            dist/Questro-Tauri/LootLazy.exe
            dist/Questro-Tauri/README.md
            dist/Questro-Tauri/LICENSE
            dist/Questro-Tauri/THIRD-PARTY-NOTICES.txt